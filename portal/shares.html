<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shares — SODIS-SACCO Member Portal</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="portal-shell">
  <aside class="portal-sidebar">
    <div class="brand">
      <a href="dashboard.html" style="display:flex;align-items:center;gap:10px;color:var(--white);text-decoration:none;">
        <span class="brand-mark">SS</span>
        <span class="brand-text"><strong>SODIS-SACCO</strong><span>Member Portal</span></span>
      </a>
    </div>
    <nav>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="savings.html">Savings</a></li>
        <li><a href="shares.html">Shares</a></li>
        <li><a href="loans.html">Loans</a></li>
        <li><a href="statements.html">Statements</a></li>
        <li><a href="notifications.html">Notifications</a></li>
        <li><a href="requests.html">Requests</a></li>
      </ul>
      <div class="logout-row">
        <ul>
          <li><a href="#" data-logout>Log out</a></li>
          <li><a href="../index.html">← SODIS-SACCO website</a></li>
        </ul>
      </div>
    </nav>
  </aside>

  <div class="portal-main">
    <div class="portal-topbar">
      <button class="sidebar-toggle">Menu</button>
      <div style="text-align:right;">
        <div style="font-weight:600;color:var(--indigo);" data-member-name>—</div>
        <div style="font-size:0.8rem;color:var(--ink-soft);">Membership No: <span data-member-number>—</span></div>
      </div>
    </div>

    <div class="portal-content">
      <h1 style="font-size:1.4rem;">My Shares</h1>

      <div class="summary-grid" style="grid-template-columns:repeat(2,1fr);max-width:520px;">
        <div class="summary-card gold">
          <div class="label">Number of shares</div>
          <div class="figure" id="shares-count">—</div>
        </div>
        <div class="summary-card gold">
          <div class="label">Total share value</div>
          <div class="figure" id="shares-value">—</div>
        </div>
      </div>

      <div class="section-head" style="margin-bottom:14px;">
        <h2 style="font-size:1.1rem;">Share transaction history</h2>
      </div>
      <div id="txn-wrap">
        <p class="text-soft">Loading…</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="js/portal.js"></script>
<script>
(async () => {
  const member = await requirePortalAuth();
  if (!member) return;

  const { data: shares } = await supabaseClient
    .from('shares')
    .select('number_of_shares, share_value')
    .eq('member_id', member.id)
    .maybeSingle();

  const count = shares ? shares.number_of_shares : 0;
  const value = shares ? shares.share_value : 0;
  document.getElementById('shares-count').textContent = count.toLocaleString();
  document.getElementById('shares-value').textContent = formatUGX(count * value);

  const { data: txns } = await supabaseClient
    .from('share_transactions')
    .select('*')
    .eq('member_id', member.id)
    .order('txn_date', { ascending: false });

  const wrap = document.getElementById('txn-wrap');
  if (!txns || txns.length === 0) {
    wrap.innerHTML = '<div class="empty-state">No share transactions recorded yet.</div>';
    return;
  }

  wrap.innerHTML = `
    <table class="data-table">
      <thead>
        <tr><th>Date</th><th>Description</th><th style="text-align:right;">Shares change</th><th style="text-align:right;">Amount</th></tr>
      </thead>
      <tbody>
        ${txns.map(t => `
          <tr>
            <td>${formatDate(t.txn_date)}</td>
            <td>${escapeHtml(t.description)}</td>
            <td class="num">${t.shares_change > 0 ? '+' : ''}${t.shares_change}</td>
            <td class="num">${formatUGX(t.amount)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
})();
</script>
</body>
</html>
