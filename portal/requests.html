<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requests — SODIS-SACCO Member Portal</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="portal-shell">
  <aside class="portal-sidebar">
    <div class="brand">
      <a href="dashboard.html" style="display:flex;align-items:center;gap:10px;color:var(--white);text-decoration:none;">
        <span class="brand-mark">SS</span>
        <span class="brand-text"><strong>SODIS-SACCO</strong><span>Member Portal</span></span>
      </a>
    </div>
    <nav>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="savings.html">Savings</a></li>
        <li><a href="shares.html">Shares</a></li>
        <li><a href="loans.html">Loans</a></li>
        <li><a href="statements.html">Statements</a></li>
        <li><a href="notifications.html">Notifications</a></li>
        <li><a href="requests.html">Requests</a></li>
      </ul>
      <div class="logout-row">
        <ul>
          <li><a href="#" data-logout>Log out</a></li>
          <li><a href="../index.html">← SODIS-SACCO website</a></li>
        </ul>
      </div>
    </nav>
  </aside>

  <div class="portal-main">
    <div class="portal-topbar">
      <button class="sidebar-toggle">Menu</button>
      <div style="text-align:right;">
        <div style="font-weight:600;color:var(--indigo);" data-member-name>—</div>
        <div style="font-size:0.8rem;color:var(--ink-soft);">Membership No: <span data-member-number>—</span></div>
      </div>
    </div>

    <div class="portal-content">
      <h1 style="font-size:1.4rem;">Requests</h1>

      <div class="form-panel" style="max-width:560px;margin-bottom:36px;">
        <div id="form-msg" class="form-msg"></div>
        <form id="request-form">
          <div class="field">
            <label for="request_type">Request type *</label>
            <select id="request_type" required>
              <option value="">Select…</option>
              <option>Statement request</option>
              <option>Address / contact update</option>
              <option>Loan clearance</option>
              <option>Next-of-kin update</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field">
            <label for="details">Details</label>
            <textarea id="details" rows="4" placeholder="Add any details the office should know"></textarea>
          </div>
          <button type="submit" class="btn btn-green btn-block" id="submit-btn">Submit request</button>
        </form>
      </div>

      <div class="section-head" style="margin-bottom:14px;">
        <h2 style="font-size:1.1rem;">Your requests</h2>
      </div>
      <div id="requests-wrap">
        <p class="text-soft">Loading…</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="js/portal.js"></script>
<script>
let currentMember = null;

async function loadRequests() {
  const { data: requests } = await supabaseClient
    .from('member_requests')
    .select('*')
    .eq('member_id', currentMember.id)
    .order('submitted_at', { ascending: false });

  const wrap = document.getElementById('requests-wrap');
  if (!requests || requests.length === 0) {
    wrap.innerHTML = '<div class="empty-state">You have not submitted any requests yet.</div>';
    return;
  }

  const statusBadge = (status) => {
    if (status === 'Completed') return '<span class="badge badge-green">Completed</span>';
    if (status === 'In Progress') return '<span class="badge">In Progress</span>';
    return '<span class="badge" style="background:var(--ink-soft);color:var(--white);">Submitted</span>';
  };

  wrap.innerHTML = `
    <table class="data-table">
      <thead><tr><th>Date</th><th>Type</th><th>Details</th><th>Status</th></tr></thead>
      <tbody>
        ${requests.map(r => `
          <tr>
            <td>${formatDate(r.submitted_at)}</td>
            <td>${escapeHtml(r.request_type)}</td>
            <td>${escapeHtml(r.details || '—')}</td>
            <td>${statusBadge(r.status)}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

(async () => {
  currentMember = await requirePortalAuth();
  if (!currentMember) return;
  await loadRequests();
})();

document.getElementById('request-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('form-msg');
  msg.className = 'form-msg';

  const payload = {
    member_id: currentMember.id,
    request_type: document.getElementById('request_type').value,
    details: document.getElementById('details').value.trim() || null
  };

  btn.disabled = true;
  btn.textContent = 'Submitting…';

  const { error } = await supabaseClient.from('member_requests').insert([payload]);

  if (error) {
    msg.textContent = 'Could not submit your request. Please try again.';
    msg.className = 'form-msg error show';
  } else {
    msg.textContent = 'Request submitted. The office will follow up with you.';
    msg.className = 'form-msg success show';
    document.getElementById('request-form').reset();
    await loadRequests();
  }

  btn.disabled = false;
  btn.textContent = 'Submit request';
});
</script>
</body>
</html>
