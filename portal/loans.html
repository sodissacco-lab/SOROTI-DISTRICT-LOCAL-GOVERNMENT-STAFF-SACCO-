<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loans — SODIS-SACCO Member Portal</title>
<link rel="icon" href="../assets/favicon.png" type="image/png">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1B3A5C">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="portal-shell">
  <aside class="portal-sidebar">
    <div class="brand">
      <a href="dashboard.html" style="display:flex;align-items:center;gap:10px;color:var(--white);text-decoration:none;">
        <span class="brand-mark"><img src="../assets/logo.png" alt="SODIS-SACCO logo"></span>
        <span class="brand-text"><strong>SODIS-SACCO</strong><span>Member Portal</span></span>
      </a>
    </div>
    <nav>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="savings.html">Savings</a></li>
        <li><a href="shares.html">Shares</a></li>
        <li><a href="loans.html">Loans</a></li>
        <li><a href="statements.html">Statements</a></li>
        <li><a href="notifications.html">Notifications</a></li>
        <li><a href="requests.html">Requests</a></li>
      </ul>
      <div class="logout-row">
        <ul>
          <li><a href="#" data-logout>Log out</a></li>
          <li><a href="../index.html">← SODIS-SACCO website</a></li>
        </ul>
      </div>
    </nav>
  </aside>

  <div class="portal-main">
    <div class="portal-topbar">
      <button class="sidebar-toggle">Menu</button>
      <div style="text-align:right;">
        <div style="font-weight:600;color:var(--indigo);" data-member-name>—</div>
        <div style="font-size:0.8rem;color:var(--ink-soft);">Membership No: <span data-member-number>—</span></div>
      </div>
    </div>

    <div class="portal-content">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
        <h1 style="font-size:1.4rem;margin:0;">Loans</h1>
        <button class="btn btn-green btn-sm" id="toggle-apply-btn">Apply for a loan</button>
      </div>

      <div id="apply-panel" class="form-panel" style="max-width:560px;margin-bottom:32px;display:none;">
        <h3 class="mt-0">Loan application</h3>
        <div id="form-msg" class="form-msg"></div>
        <form id="apply-form">
          <div class="field">
            <label for="product">Loan product *</label>
            <select id="product" required>
              <option value="">Select…</option>
              <option>Ordinary Loan</option>
              <option>Emergency Loan</option>
              <option>Express Loan</option>
              <option>Weekend Loan</option>
            </select>
          </div>
          <div class="field-row two">
            <div class="field">
              <label for="amount">Amount requested (UGX) *</label>
              <input type="number" id="amount" min="1" required>
            </div>
            <div class="field">
              <label for="period_months">Repayment period (months) *</label>
              <input type="number" id="period_months" min="1" required>
            </div>
          </div>
          <div class="field">
            <label for="purpose">Purpose *</label>
            <textarea id="purpose" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn btn-green btn-block" id="submit-btn">Submit application</button>
        </form>
      </div>

      <div class="section-head" style="margin-bottom:14px;">
        <h2 style="font-size:1.1rem;">My loan applications</h2>
      </div>
      <div id="applications-wrap" style="margin-bottom:36px;">
        <p class="text-soft">Loading…</p>
      </div>

      <div class="section-head" style="margin-bottom:14px;">
        <h2 style="font-size:1.1rem;">My active &amp; past loans</h2>
      </div>
      <div id="loans-wrap">
        <p class="text-soft">Loading…</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="js/portal.js"></script>
<script>
let currentMember = null;

document.getElementById('toggle-apply-btn').addEventListener('click', () => {
  const panel = document.getElementById('apply-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  if (panel.style.display === 'block') panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
});

document.getElementById('apply-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('form-msg');
  msg.className = 'form-msg';

  const payload = {
    member_id: currentMember.id,
    product: document.getElementById('product').value,
    amount: Number(document.getElementById('amount').value),
    period_months: Number(document.getElementById('period_months').value),
    purpose: document.getElementById('purpose').value.trim()
  };

  btn.disabled = true;
  btn.textContent = 'Submitting…';

  const { error } = await supabaseClient.from('loan_applications').insert([payload]);

  if (error) {
    msg.textContent = 'Could not submit your application. Please try again.';
    msg.className = 'form-msg error show';
  } else {
    msg.textContent = 'Application submitted. You can track its status below.';
    msg.className = 'form-msg success show';
    document.getElementById('apply-form').reset();
    await loadApplications();
  }

  btn.disabled = false;
  btn.textContent = 'Submit application';
});

function appStatusBadge(status) {
  if (status === 'Approved') return '<span class="badge badge-green">Approved</span>';
  if (status === 'Rejected') return '<span class="badge" style="background:var(--brick);color:var(--white);">Rejected</span>';
  return '<span class="badge">Under review</span>';
}

async function loadApplications() {
  const wrap = document.getElementById('applications-wrap');
  const { data: apps, error } = await supabaseClient
    .from('loan_applications')
    .select('*')
    .eq('member_id', currentMember.id)
    .order('submitted_at', { ascending: false });

  if (error || !apps || apps.length === 0) {
    wrap.innerHTML = '<div class="empty-state">You have not applied for a loan yet.</div>';
    return;
  }

  wrap.innerHTML = apps.map(a => `
    <div class="app-card ${a.status === 'Approved' ? 'status-approved' : a.status === 'Rejected' ? 'status-rejected' : ''}">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:start;">
        <h3>${escapeHtml(a.product)}</h3>
        ${appStatusBadge(a.status)}
      </div>
      <div class="app-meta">
        <div><span class="k">Amount requested:</span> ${formatUGX(a.amount)}</div>
        <div><span class="k">Period:</span> ${a.period_months} months</div>
        <div><span class="k">Submitted:</span> ${formatDate(a.submitted_at)}</div>
        ${a.decided_at ? `<div><span class="k">Decided:</span> ${formatDate(a.decided_at)}</div>` : ''}
      </div>
      <p class="text-soft" style="margin:8px 0 0;font-size:0.88rem;">${escapeHtml(a.purpose)}</p>
      ${a.decision_notes ? `<p style="margin:10px 0 0;font-size:0.9rem;"><strong>Note from SODIS-SACCO:</strong> ${escapeHtml(a.decision_notes)}</p>` : ''}
    </div>
  `).join('');
}

async function loadLoans() {
  const { data: loans } = await supabaseClient
    .from('loans')
    .select('*')
    .eq('member_id', currentMember.id)
    .order('disbursed_at', { ascending: false });

  const wrap = document.getElementById('loans-wrap');

  if (!loans || loans.length === 0) {
    wrap.innerHTML = '<div class="empty-state">No disbursed loans on record yet.</div>';
    return;
  }

  const statusBadge = (status) => {
    if (status === 'Cleared') return '<span class="badge badge-green">Cleared</span>';
    if (status === 'Overdue') return '<span class="badge" style="background:var(--brick);color:var(--white);">Overdue</span>';
    return '<span class="badge">Active</span>';
  };

  const cards = await Promise.all(loans.map(async (loan) => {
    const { data: repayments } = await supabaseClient
      .from('loan_repayments')
      .select('*')
      .eq('loan_id', loan.id)
      .order('txn_date', { ascending: false });

    const repaymentRows = (repayments || []).map(r => `
      <tr>
        <td>${formatDate(r.txn_date)}</td>
        <td class="num">${formatUGX(r.amount)}</td>
        <td class="num">${formatUGX(r.principal_portion)}</td>
        <td class="num">${formatUGX(r.interest_portion)}</td>
      </tr>
    `).join('');

    return `
      <div class="loan-card">
        <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px;">
          <h3>${escapeHtml(loan.product || 'Loan')}</h3>
          ${statusBadge(loan.status)}
        </div>
        <div class="loan-meta">
          <div class="item"><div class="label">Principal</div><div class="value">${formatUGX(loan.principal)}</div></div>
          <div class="item"><div class="label">Outstanding</div><div class="value">${formatUGX(loan.outstanding_balance)}</div></div>
          <div class="item"><div class="label">Disbursed</div><div class="value" style="font-size:0.95rem;">${formatDate(loan.disbursed_at)}</div></div>
          <div class="item"><div class="label">Next installment</div><div class="value" style="font-size:0.95rem;">${loan.next_installment_amount ? formatUGX(loan.next_installment_amount) : '—'}</div></div>
        </div>
        ${loan.next_installment_date ? `<p class="text-soft" style="margin-top:12px;font-size:0.88rem;">Next due: ${formatDate(loan.next_installment_date)}</p>` : ''}
        ${repaymentRows ? `
          <hr class="ledger-rule" style="margin:18px 0;">
          <div style="font-size:0.88rem;font-weight:600;color:var(--indigo);margin-bottom:8px;">Repayment history</div>
          <table class="data-table">
            <thead><tr><th>Date</th><th style="text-align:right;">Amount</th><th style="text-align:right;">Principal</th><th style="text-align:right;">Interest</th></tr></thead>
            <tbody>${repaymentRows}</tbody>
          </table>
        ` : ''}
      </div>
    `;
  }));

  wrap.innerHTML = cards.join('');
}

(async () => {
  currentMember = await requirePortalAuth();
  if (!currentMember) return;
  await loadApplications();
  await loadLoans();
})();
</script>
</body>
</html>
