<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Savings — SODIS-SACCO Member Portal</title>
<link rel="icon" href="../assets/favicon.png" type="image/png">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="portal-shell">
  <aside class="portal-sidebar">
    <div class="brand">
      <a href="dashboard.html" style="display:flex;align-items:center;gap:10px;color:var(--white);text-decoration:none;">
        <span class="brand-mark"><img src="../assets/logo.png" alt="SODIS-SACCO logo"></span>
        <span class="brand-text"><strong>SODIS-SACCO</strong><span>Member Portal</span></span>
      </a>
    </div>
    <nav>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="savings.html">Savings</a></li>
        <li><a href="shares.html">Shares</a></li>
        <li><a href="loans.html">Loans</a></li>
        <li><a href="statements.html">Statements</a></li>
        <li><a href="notifications.html">Notifications</a></li>
        <li><a href="requests.html">Requests</a></li>
      </ul>
      <div class="logout-row">
        <ul>
          <li><a href="#" data-logout>Log out</a></li>
          <li><a href="../index.html">← SODIS-SACCO website</a></li>
        </ul>
      </div>
    </nav>
  </aside>

  <div class="portal-main">
    <div class="portal-topbar">
      <button class="sidebar-toggle">Menu</button>
      <div style="text-align:right;">
        <div style="font-weight:600;color:var(--indigo);" data-member-name>—</div>
        <div style="font-size:0.8rem;color:var(--ink-soft);">Membership No: <span data-member-number>—</span></div>
      </div>
    </div>

    <div class="portal-content">
      <h1 style="font-size:1.4rem;">My Savings</h1>

      <div class="summary-grid" style="grid-template-columns:1fr;max-width:320px;">
        <div class="summary-card">
          <div class="label">Current balance</div>
          <div class="figure" id="balance-figure">—</div>
        </div>
      </div>

      <div class="section-head" style="margin-bottom:14px;">
        <h2 style="font-size:1.1rem;">Transaction history</h2>
      </div>
      <div id="txn-wrap">
        <p class="text-soft">Loading…</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="js/portal.js"></script>
<script>
(async () => {
  const member = await requirePortalAuth();
  if (!member) return;

  const { data: account } = await supabaseClient
    .from('savings_accounts')
    .select('balance')
    .eq('member_id', member.id)
    .maybeSingle();
  document.getElementById('balance-figure').textContent = formatUGX(account ? account.balance : 0);

  const { data: txns } = await supabaseClient
    .from('savings_transactions')
    .select('*')
    .eq('member_id', member.id)
    .order('txn_date', { ascending: false });

  const wrap = document.getElementById('txn-wrap');
  if (!txns || txns.length === 0) {
    wrap.innerHTML = '<div class="empty-state">No savings transactions recorded yet.</div>';
    return;
  }

  wrap.innerHTML = `
    <table class="data-table">
      <thead>
        <tr><th>Date</th><th>Description</th><th style="text-align:right;">Credit</th><th style="text-align:right;">Debit</th><th style="text-align:right;">Balance</th></tr>
      </thead>
      <tbody>
        ${txns.map(t => `
          <tr>
            <td>${formatDate(t.txn_date)}</td>
            <td>${escapeHtml(t.description)}</td>
            <td class="num">${t.credit ? formatUGX(t.credit) : ''}</td>
            <td class="num">${t.debit ? formatUGX(t.debit) : ''}</td>
            <td class="num">${formatUGX(t.balance_after)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
})();
</script>
</body>
</html>
