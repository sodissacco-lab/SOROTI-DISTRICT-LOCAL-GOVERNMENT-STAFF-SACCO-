<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Loans — SODIS-SACCO Member Portal</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="portal-shell">
  <aside class="portal-sidebar">
    <div class="brand">
      <a href="dashboard.html" style="display:flex;align-items:center;gap:10px;color:var(--white);text-decoration:none;">
        <span class="brand-mark">SS</span>
        <span class="brand-text"><strong>SODIS-SACCO</strong><span>Member Portal</span></span>
      </a>
    </div>
    <nav>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="savings.html">Savings</a></li>
        <li><a href="shares.html">Shares</a></li>
        <li><a href="loans.html">Loans</a></li>
        <li><a href="statements.html">Statements</a></li>
        <li><a href="notifications.html">Notifications</a></li>
        <li><a href="requests.html">Requests</a></li>
      </ul>
      <div class="logout-row">
        <ul>
          <li><a href="#" data-logout>Log out</a></li>
          <li><a href="../index.html">← SODIS-SACCO website</a></li>
        </ul>
      </div>
    </nav>
  </aside>

  <div class="portal-main">
    <div class="portal-topbar">
      <button class="sidebar-toggle">Menu</button>
      <div style="text-align:right;">
        <div style="font-weight:600;color:var(--indigo);" data-member-name>—</div>
        <div style="font-size:0.8rem;color:var(--ink-soft);">Membership No: <span data-member-number>—</span></div>
      </div>
    </div>

    <div class="portal-content">
      <h1 style="font-size:1.4rem;">My Loans</h1>
      <div id="loans-wrap">
        <p class="text-soft">Loading…</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="js/portal.js"></script>
<script>
(async () => {
  const member = await requirePortalAuth();
  if (!member) return;

  const { data: loans } = await supabaseClient
    .from('loans')
    .select('*')
    .eq('member_id', member.id)
    .order('disbursed_at', { ascending: false });

  const wrap = document.getElementById('loans-wrap');

  if (!loans || loans.length === 0) {
    wrap.innerHTML = `
      <div class="empty-state">
        You have no loans on record.<br>
        <a href="../loans.html" style="display:inline-block;margin-top:10px;">View loan products →</a>
      </div>`;
    return;
  }

  const statusBadge = (status) => {
    if (status === 'Cleared') return '<span class="badge badge-green">Cleared</span>';
    if (status === 'Overdue') return '<span class="badge" style="background:var(--brick);color:var(--white);">Overdue</span>';
    return '<span class="badge">Active</span>';
  };

  const cards = await Promise.all(loans.map(async (loan) => {
    const { data: repayments } = await supabaseClient
      .from('loan_repayments')
      .select('*')
      .eq('loan_id', loan.id)
      .order('txn_date', { ascending: false });

    const repaymentRows = (repayments || []).map(r => `
      <tr>
        <td>${formatDate(r.txn_date)}</td>
        <td class="num">${formatUGX(r.amount)}</td>
        <td class="num">${formatUGX(r.principal_portion)}</td>
        <td class="num">${formatUGX(r.interest_portion)}</td>
      </tr>
    `).join('');

    return `
      <div class="loan-card">
        <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px;">
          <h3>${escapeHtml(loan.product || 'Loan')}</h3>
          ${statusBadge(loan.status)}
        </div>
        <div class="loan-meta">
          <div class="item"><div class="label">Principal</div><div class="value">${formatUGX(loan.principal)}</div></div>
          <div class="item"><div class="label">Outstanding</div><div class="value">${formatUGX(loan.outstanding_balance)}</div></div>
          <div class="item"><div class="label">Disbursed</div><div class="value" style="font-size:0.95rem;">${formatDate(loan.disbursed_at)}</div></div>
          <div class="item"><div class="label">Next installment</div><div class="value" style="font-size:0.95rem;">${loan.next_installment_amount ? formatUGX(loan.next_installment_amount) : '—'}</div></div>
        </div>
        ${loan.next_installment_date ? `<p class="text-soft" style="margin-top:12px;font-size:0.88rem;">Next due: ${formatDate(loan.next_installment_date)}</p>` : ''}
        ${repaymentRows ? `
          <hr class="ledger-rule" style="margin:18px 0;">
          <div style="font-size:0.88rem;font-weight:600;color:var(--indigo);margin-bottom:8px;">Repayment history</div>
          <table class="data-table">
            <thead><tr><th>Date</th><th style="text-align:right;">Amount</th><th style="text-align:right;">Principal</th><th style="text-align:right;">Interest</th></tr></thead>
            <tbody>${repaymentRows}</tbody>
          </table>
        ` : ''}
      </div>
    `;
  }));

  wrap.innerHTML = cards.join('');
})();
</script>
</body>
</html>
